groups:
  - name: nevma-backend
    rules:
      - alert: NevmaTelemetryCollectorDown
        expr: up{job="otel-collector"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Nevma telemetry collector is unavailable

      - alert: NevmaHighServerErrorRate
        expr: |
          sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_server_request_duration_seconds_count[5m])), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: More than five percent of Nevma requests are failing

      - alert: NevmaHighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, service_name) (rate(http_server_request_duration_seconds_bucket[5m]))
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Nevma p95 request latency is above one second

      - alert: NevmaResilienceCircuitOpen
        expr: sum by (service_name) (rate(nevma_http_client_circuit_opened_total[5m])) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: A Nevma dependency circuit breaker is opening
